schemas:
  Project:
    type: object
    properties:
      Id:
        type: integer
        description: Unique identifier for the project
      ProjectName:
        type: string
        description: Name of the project
      securityLevel:
        type: integer
        description: Security level of the project

  ProjectInput:
    type: object
    required:
      - Id
      - ProjectName
      - securityLevel
    properties:
      Id:
        type: integer
        description: Unique identifier for the project
      ProjectName:
        type: string
        description: Name of the project
      securityLevel:
        type: integer
        description: Security level of the project

  DailyDetail:
    type: object
    properties:
      Date:
        type: string
        format: date-time
        description: Date of the daily details
      UserId:
        type: integer
        description: User ID
      LeaveType:
        type: string
        nullable: true
        description: Type of leave
      ArrivalTime:
        type: string
        nullable: true
        description: Arrival time
      LeaveTime:
        type: string
        nullable: true
        description: Leave time
      PersonalTime:
        type: integer
        nullable: true
        description: Personal time in minutes
      Description:
        type: string
        nullable: true
        description: Description
      GoCost:
        type: integer
        nullable: true
        description: Cost of going
      ReturnCost:
        type: integer
        nullable: true
        description: Cost of returning
      tasks:
        type: array
        items:
          $ref: '#/components/schemas/DailyProjectTask'
        description: List of tasks for the day
      personalCarCosts:
        type: array
        items:
          $ref: '#/components/schemas/DailyPersonalCarCost'
        description: List of personal car costs for the day

  DailyProjectTask:
    type: object
    properties:
      Date:
        type: string
        format: date-time
        description: Date of the task
      UserId:
        type: integer
        description: User ID
      ProjectId:
        type: integer
        description: Project ID
      Duration:
        type: integer
        description: Duration of the task in minutes
      Description:
        type: string
        nullable: true
        description: Description of the task

  DailyPersonalCarCost:
    type: object
    properties:
      Date:
        type: string
        format: date-time
        description: Date of the cost
      UserId:
        type: integer
        description: User ID
      ProjectId:
        type: integer
        description: Project ID
      Cost:
        type: integer
        description: Cost amount
      Description:
        type: string
        nullable: true
        description: Description of the cost

  MonthlyReport:
    type: object
    properties:
      ReportId:
        type: integer
        description: Unique identifier for the report
      UserId:
        type: integer
        description: Identifier of the user
      Year:
        type: integer
        description: Gregorian year of the report
      Month:
        type: integer
        description: Gregorian month of the report (1-12)
      JalaliYear:
        type: integer
        description: Jalali year of the report
      JalaliMonth:
        type: integer
        description: Jalali month of the report (1-12)
      TotalHours:
        type: integer
        nullable: true
        description: Total hours worked in the month
      GymCost:
        type: integer
        nullable: true
        description: Gym cost for the month
      Status:
        type: string
        description: Status of the report (draft, submitted_to_group_manager, submitted_to_general_manager, submitted_to_finance, approved)
      ManagerComment:
        type: string
        nullable: true
        description: Comment from the manager
      FinanceComment:
        type: string
        nullable: true
        description: Comment from the finance team
      SubmittedAt:
        type: string
        format: date-time
        nullable: true
        description: Date and time when the report was submitted to manager
      ApprovedAt:
        type: string
        format: date-time
        nullable: true
        description: Date and time when the report was final approved
      GroupId:
        type: integer
        nullable: true
        description: Identifier of the group
      GeneralManagerStatus:
        type: string
        nullable: true
        description: Status of general manager approval (pending, approved_by_general_manager)
      Username:
        type: string
        nullable: true
        description: Username of the report owner (included in group reports)

  User:
    type: object
    properties:
      UserId:
        type: integer
        description: User ID
      Username:
        type: string
        description: Username
      Role:
        type: string
        description: User role
      GroupId:
        type: integer
        nullable: true
        description: Group ID
      GroupName:
        type: string
        nullable: true
        description: Group name
      FarsiFirstName:
        type: string
        nullable: true
        description: Persian first name
      FarsiLastName:
        type: string
        nullable: true
        description: Persian last name

  Group:
    type: object
    properties:
      GroupId:
        type: integer
        description: Group ID
      GroupName:
        type: string
        description: Group name
      ManagerId:
        type: integer
        nullable: true
        description: Manager user ID

  MonthPeriod:
    type: object
    properties:
      Year:
        type: integer
        description: Jalali year
      Month:
        type: integer
        description: Jalali month (1-12)
      StartDay:
        type: integer
        description: Start day
      StartMonth:
        type: integer
        description: Start month (1-12)
      EndDay:
        type: integer
        description: End day
      EndMonth:
        type: integer
        description: End month (1-12)

  Error:
    type: object
    properties:
      message:
        type: string
        description: Error message
      code:
        type: string
        nullable: true
        description: Error code

  ContractHours:
    type: object
    properties:
      UserId:
        type: integer
        description: User ID
      ContractArrivalTime:
        type: string
        nullable: true
        description: Contract arrival time
      ContractLeaveTime:
        type: string
        description: Contract leave time
      MinMonthlyHours:
        type: integer
        description: Minimum monthly hours

  SystemConfig:
    type: object
    properties:
      configKey:
        type: string
        description: Configuration key
      configValue:
        type: string
        description: Configuration value

  SystemStatistics:
    type: object
    properties:
      totalUsers:
        type: integer
        description: Total number of users
      totalProjects:
        type: integer
        description: Total number of projects
      totalGroups:
        type: integer
        description: Total number of groups
      totalReports:
        type: integer
        description: Total number of monthly reports
      pendingReports:
        type: integer
        description: Number of pending reports
      approvedReports:
        type: integer
        description: Number of approved reports

  UserActivitySummary:
    type: object
    properties:
      userId:
        type: integer
        description: User ID
      username:
        type: string
        description: Username
      totalHours:
        type: integer
        description: Total hours worked
      totalDays:
        type: integer
        description: Total days worked
      totalReports:
        type: integer
        description: Total reports submitted
      averageHoursPerDay:
        type: number
        format: float
        description: Average hours per day

  LogEntry:
    type: object
    properties:
      timestamp:
        type: string
        format: date-time
        description: Log timestamp
      level:
        type: string
        description: Log level (info, warn, error)
      message:
        type: string
        description: Log message
      category:
        type: string
        description: Log category
      metadata:
        type: object
        description: Additional metadata

  DashboardSettings:
    type: object
    properties:
      settingsId:
        type: integer
        description: Settings ID
      settings:
        type: object
        description: Dashboard configuration settings
      createdAt:
        type: string
        format: date-time
        description: Creation timestamp
      updatedAt:
        type: string
        format: date-time
        description: Last update timestamp

  ProjectAccessStatus:
    type: object
    properties:
      id:
        type: integer
        description: Project ID
      projectName:
        type: string
        description: Project name
      hasAccess:
        type: boolean
        description: Whether the user has access to this project


