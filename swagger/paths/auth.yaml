paths:
  /auth/login:
    post:
      summary: Authenticate user (admin or regular) and generate JWT token using username only
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  description: User's username
      responses:
        '200':
          description: Successful login, returns JWT token and user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for authentication
                  userId:
                    type: integer
                    description: User's ID
                  Username:
                    type: string
                    description: User's username
                  Role:
                    type: string
                    description: User's role (user, group_manager, general_manager, finance_manager, admin)
                  message:
                    type: string
                    description: Success message
        '400':
          description: Invalid input
        '401':
          description: Invalid username
        '500':
          description: Server error

  /auth/login-as:
    post:
      summary: Login as another user (for managers only)
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetUserId
              properties:
                targetUserId:
                  type: integer
                  description: ID of the user to impersonate
      responses:
        '200':
          description: Impersonation successful, returns new JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for the impersonated user
                  userId:
                    type: integer
                  Username:
                    type: string
                  Role:
                    type: string
                  message:
                    type: string
        '401':
          description: No token provided
        '403':
          description: Access denied - Only managers can impersonate
        '404':
          description: User not found
        '500':
          description: Server error




