paths:
  /admin/logs/categories:
    get:
      summary: Get all available log categories and their files
      tags:
        - Admin - Logs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of log categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    category:
                      type: string
                    files:
                      type: array
                      items:
                        type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin only

  /admin/logs/{category}:
    get:
      summary: Get logs for a specific category
      tags:
        - Admin - Logs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
          description: Log category (admin, api, auth, database, errors, reports, system, combined)
        - in: query
          name: date
          schema:
            type: string
          description: Date in YYYY-MM-DD format
        - in: query
          name: level
          schema:
            type: string
          description: Log level filter (info, warn, error)
        - in: query
          name: search
          schema:
            type: string
          description: Search term
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Logs for the specified category
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '404':
          description: Log file not found

  /admin/logs/search/all:
    get:
      summary: Search across all logs
      tags:
        - Admin - Logs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Search query
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
        - in: query
          name: level
          schema:
            type: string
          description: Filter by log level
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'

  /admin/logs/download/{category}/{date}:
    get:
      summary: Download a specific log file
      tags:
        - Admin - Logs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
        - in: path
          name: date
          required: true
          schema:
            type: string
          description: Date in YYYY-MM-DD format
      responses:
        '200':
          description: Log file download
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Log file not found


